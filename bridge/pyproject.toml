[project]
name = "device-bridge"
version = "0.1.0"
description = "macOS アプリから起動される iOS デバイス情報取得 CLI"
requires-python = ">=3.13"
dependencies = [
    "pymobiledevice3>=11.1.6",
]

[project.scripts]
device-bridge = "device_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device_bridge"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
