[project]
name = "device-bridge"
version = "0.1.0"
description = "macOS アプリから起動される iOS デバイス情報取得 CLI"
requires-python = ">=3.13"
dependencies = [
    "pymobiledevice3>=11.1.6",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "anthropic>=0.69.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
device-bridge = "device_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device_bridge"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
