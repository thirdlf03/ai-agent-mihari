name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            bridge/uv.lock
            room/uv.lock

      - name: Install bridge
        run: uv sync --locked
        working-directory: bridge

      - name: Install room
        run: uv sync --locked
        working-directory: room

      - name: Lint
        run: make lint-python

      - name: Test
        run: make test-python

  swift:
    name: Swift (format + build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Lint
        run: make lint-swift

      - name: Build
        run: make build
