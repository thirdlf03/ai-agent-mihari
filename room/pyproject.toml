[project]
name = "mihari-room"
version = "0.1.0"
description = "みはりちゃんの VPS 作業部屋。Discord の口と Hermes の呼び出しを持つ。"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "discord-py>=2.4.0",
]

[project.scripts]
mihari-room = "mihari_room.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mihari_room"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
